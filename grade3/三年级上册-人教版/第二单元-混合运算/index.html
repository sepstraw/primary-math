<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第一单元 · 混合运算与数量关系（一） | 小学数学可视化</title>
<style>
  :root{
    --paper:#fffaf3; --card:#ffffff; --ink:#2f2b28; --muted:#8a8078;
    --line:#efe3d4; --accent:#e8862e; --accent-soft:#fdf1e4;
    --green:#2f9e68; --red:#d05353; --blue:#4a7fd4; --blue-soft:#e8effb;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",sans-serif;
    line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:26px 20px 80px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .crumb{font-size:14px;color:var(--muted);margin:0 0 8px}
  h1{font-size:30px;margin:0 0 4px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 26px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:0 0 20px;box-shadow:0 1px 2px rgba(90,66,40,.04)}
  .card h2{font-size:19px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  .card h2 .n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;flex:none}
  .lead{color:var(--muted);font-size:14px;margin:2px 0 16px}
  .fact{display:flex;gap:10px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
  .fact li{background:var(--accent-soft);border-radius:10px;padding:6px 12px;font-size:14px}
  .fact b{color:var(--accent)}
  svg{display:block;width:100%;height:auto;border-radius:14px;outline:none;background:linear-gradient(#fffdfa,#fff6ea)}
  svg text{font-family:inherit}

  .tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
  .tabs button{font:inherit;font-size:14px;cursor:pointer;border-radius:10px;padding:6px 16px;background:#fff;border:1.5px solid #e9dbc9;color:var(--muted);transition:.15s;font-variant-numeric:tabular-nums}
  .tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:#b96a1c;font-weight:700}

  .expr{
    text-align:center;font-size:38px;font-weight:700;letter-spacing:2px;
    font-variant-numeric:tabular-nums;padding:18px 10px;line-height:1.4;
  }
  .expr b{color:var(--accent);background:#fdeedd;border-radius:8px;padding:0 6px}
  .note{text-align:center;font-size:14px;color:var(--muted);min-height:26px}
  .center{text-align:center;margin:14px 0 0}

  .btn{font:inherit;font-size:14px;cursor:pointer;border-radius:10px;padding:8px 20px;background:var(--accent);border:0;color:#fff;font-weight:600}
  .btn:hover{background:#d5781f}
  .btn.ghost{background:#fff;border:1.5px solid #e9dbc9;color:var(--ink);font-weight:400}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}

  .ctrl{display:flex;align-items:center;gap:12px;margin:14px 0 0;flex-wrap:wrap}
  .ctrl label{font-size:14px;color:var(--muted);width:76px;flex:none}
  .ctrl .val{font-size:15px;font-weight:700;width:76px;flex:none;font-variant-numeric:tabular-nums;text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 140px;height:6px;border-radius:6px;background:#f0e3d3;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 4px rgba(180,110,40,.35);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;cursor:pointer}

  .timebox{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 0}
  .timebox div{background:#fdf6ee;border-radius:12px;padding:10px 18px;text-align:center;min-width:120px}
  .timebox .k{font-size:12px;color:var(--muted)}
  .timebox .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .timebox .v.end{color:var(--blue)}

  .conclusion{margin:16px 0 0;padding:12px 16px;border-radius:12px;background:#e7f4ec;color:#276c4a;font-size:14px}
  .conclusion b{color:var(--green)}
  .hint{font-size:13px;color:var(--muted);margin:12px 0 0;text-align:center}

  .q{padding:16px 0;border-top:1px dashed var(--line)}
  .q:first-of-type{border-top:0;padding-top:4px}
  .q .stem{font-size:15px;margin:0 0 10px}
  .q .stem .idx{color:var(--accent);font-weight:700;margin-right:6px}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opts button{font:inherit;font-size:15px;cursor:pointer;background:#fff;border:1.5px solid #e9dbc9;color:var(--ink);border-radius:12px;padding:8px 18px;transition:.15s}
  .opts button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
  .opts button:disabled{cursor:default}
  .opts button.ok{border-color:var(--green);background:#e7f4ec;color:#276c4a;font-weight:700}
  .opts button.no{border-color:var(--red);background:#fbeaea;color:#a33;text-decoration:line-through}
  .why{font-size:14px;color:var(--muted);margin:10px 0 0;display:none}
  .why.show{display:block}
  .score{margin:18px 0 0;padding-top:16px;border-top:1px dashed var(--line);font-size:15px;color:var(--muted)}
  .score b{color:var(--accent);font-size:20px;margin:0 2px}

  .nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:28px}
  .nav a{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 18px;font-size:14px;color:var(--ink)}
  .nav a:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
  .nav a.ghost{color:var(--muted)}

  @media(max-width:520px){ h1{font-size:25px} .card{padding:18px} .expr{font-size:30px} }
</style>
</head>
<body>
<div class="wrap">

  <p class="crumb"><a href="../../../index.html">小学数学</a> ／ <a href="../index.html">人教版三年级上册</a> ／ 第二单元</p>
  <h1>第二单元 · 混合运算</h1>
  <p class="sub">🧮 先算乘除，再算加减；有括号先算括号</p>

  <section class="card">
    <h2><span class="n">1</span>混合运算的顺序</h2>
    <p class="lead">一个式子里有加减也有乘除，按这两条来。</p>
    <ul class="fact">
      <li>没有括号：先算 <b>乘、除</b>，再算 <b>加、减</b></li>
      <li>有括号：先算 <b>括号里面</b></li>
      <li>只有加减或只有乘除：<b>从左往右</b>算</li>
    </ul>
    <p class="conclusion">同样的数字，加不加括号，结果完全不同：<b>12 ＋ 3 × 4 ＝ 24</b>，而 <b>(12 ＋ 3) × 4 ＝ 60</b>。</p>
  </section>

  <section class="card">
    <h2><span class="n">2</span>一步一步算</h2>
    <p class="lead">选一个式子，点「下一步」看它怎么化简。</p>

    <div class="tabs" id="picks"></div>

    <p class="expr" id="expr"></p>
    <p class="note" id="note"></p>

    <div class="center">
      <button class="btn" id="next" type="button">下一步</button>
      <button class="btn ghost" id="again" type="button">重来</button>
    </div>
  </section>

  

  <section class="card">
    <h2><span class="n">3</span>练一练</h2>
    <p class="lead">五道题。</p>
    <div id="quiz"></div>
    <p class="score" id="score">已经答对 <b>0</b> 题</p>
  </section>

  <nav class="nav">
    <a class="ghost" href="../第一单元-观察物体/index.html">← 第一单元 · 观察物体</a>
    <a class="ghost" href="../../../index.html">回主页</a>
    <a href="../第三单元-毫米分米和千米/index.html">第三单元 · 毫米、分米和千米 →</a>
  </nav>

</div>

<script>
(function(){
  'use strict';

  /* ========== 逐步化简 ========== */
  var CASES = [
    {
      label: '12 ＋ 3 × 4',
      steps: [
        { html: '12 ＋ <b>3 × 4</b>', note: '没有括号，先算乘法。' },
        { html: '12 ＋ <b>12</b>', note: '3 × 4 ＝ 12，式子变成 12 ＋ 12。' },
        { html: '<b>24</b>', note: '最后算加法：12 ＋ 12 ＝ 24。' }
      ]
    },
    {
      label: '(12 ＋ 3) × 4',
      steps: [
        { html: '<b>(12 ＋ 3)</b> × 4', note: '有括号，先算括号里面的。' },
        { html: '<b>15</b> × 4', note: '12 ＋ 3 ＝ 15，式子变成 15 × 4。' },
        { html: '<b>60</b>', note: '15 × 4 ＝ 60。' }
      ]
    },
    {
      label: '36 ÷ 6 ＋ 5',
      steps: [
        { html: '<b>36 ÷ 6</b> ＋ 5', note: '先算除法。' },
        { html: '6 ＋ 5', note: '36 ÷ 6 ＝ 6。' },
        { html: '<b>11</b>', note: '6 ＋ 5 ＝ 11。' }
      ]
    },
    {
      label: '48 － 18 ÷ 3',
      steps: [
        { html: '48 － <b>18 ÷ 3</b>', note: '先算除法，再算减法。' },
        { html: '48 － <b>6</b>', note: '18 ÷ 3 ＝ 6。' },
        { html: '<b>42</b>', note: '48 － 6 ＝ 42。' }
      ]
    }
  ];

  var cur = 0, step = 0;
  var picks = document.getElementById('picks');
  var expr = document.getElementById('expr');
  var note = document.getElementById('note');

  CASES.forEach(function(c, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = c.label;
    b.className = (i === 0) ? 'on' : '';
    b.addEventListener('click', function(){
      cur = i; step = 0;
      Array.prototype.forEach.call(picks.children, function(x, j){
        x.className = (j === i) ? 'on' : '';
      });
      render();
    });
    picks.appendChild(b);
  });

  function render(){
    var s = CASES[cur].steps[step];
    expr.innerHTML = s.html;
    note.textContent = s.note;
  }

  document.getElementById('next').addEventListener('click', function(){
    if (step < CASES[cur].steps.length - 1){ step++; render(); }
  });
  document.getElementById('again').addEventListener('click', function(){
    step = 0; render();
  });
  render();

  /* ========== 练一练 ========== */
    var QUIZ = [
    { q:'12 ＋ 3 × 4 等于多少？', opts:['60','24','19'], a:1,
      why:'先算乘法：3 × 4 ＝ 12；再加：12 ＋ 12 ＝ 24。' },
    { q:'(12 ＋ 3) × 4 等于多少？', opts:['60','24','48'], a:0,
      why:'有括号先算括号：12 ＋ 3 ＝ 15；再乘：15 × 4 ＝ 60。' },
    { q:'48 ÷ 6 － 2 等于多少？', opts:['6','10','4'], a:0,
      why:'先算除法：48 ÷ 6 ＝ 8；再减：8 － 2 ＝ 6。' },
    { q:'20 － 4 × 3 等于多少？', opts:['48','8','16'], a:1,
      why:'先算乘法：4 × 3 ＝ 12；再减：20 － 12 ＝ 8。' },
    { q:'下面哪个算式要先算加法？', opts:['(12 ＋ 3) × 4','12 ＋ 3 × 4','12 × 3 ＋ 4'], a:0,
      why:'只有加了括号的那一个，加法才排在乘法前面算。' }
  ];

  var box = document.getElementById('quiz');
  var scoreEl = document.getElementById('score');
  var right = 0;

  QUIZ.forEach(function(item, qi){
    var wrap = document.createElement('div');
    wrap.className = 'q';
    var stem = document.createElement('p');
    stem.className = 'stem';
    stem.innerHTML = '<span class="idx">' + (qi + 1) + '.</span>' + item.q;
    wrap.appendChild(stem);

    var opts = document.createElement('div');
    opts.className = 'opts';
    var btns = [];
    item.opts.forEach(function(label, oi){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.addEventListener('click', function(){
        var correct = (oi === item.a);
        btns.forEach(function(x){ x.disabled = true; });
        btns[item.a].classList.add('ok');
        if (!correct) b.classList.add('no');
        if (correct){ right++; scoreEl.innerHTML = '已经答对 <b>' + right + '</b> 题'; }
        why.classList.add('show');
      });
      btns.push(b);
      opts.appendChild(b);
    });
    wrap.appendChild(opts);

    var why = document.createElement('p');
    why.className = 'why';
    why.textContent = '💡 ' + item.why;
    wrap.appendChild(why);
    box.appendChild(wrap);
  });
})();
</script>
</body>
</html>
